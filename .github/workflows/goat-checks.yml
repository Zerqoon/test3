name: GOAT bot checks

on:
  push:
    paths:
      - 'R3V0-Discord-Bot-v2/**'
      - '.github/workflows/goat-checks.yml'
  pull_request:
    paths:
      - 'R3V0-Discord-Bot-v2/**'
      - '.github/workflows/goat-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: R3V0-Discord-Bot-v2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: R3V0-Discord-Bot-v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run doctor
